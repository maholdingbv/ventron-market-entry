<head>

  <!-- ========================================================
       BASIC SETTINGS
  ========================================================= -->

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080D14"
  >


  <!-- ========================================================
       PAGE TITLE + DESCRIPTION
  ========================================================= -->

  <title>
    VENTRON — Engineering starts in the field.
  </title>

  <meta
    name="description"
    content="VENTRON is a European OEM developing the next generation of suction excavation equipment for infrastructure and industrial applications."
  >


  <!-- ========================================================
       OPEN GRAPH
       Used by WhatsApp, LinkedIn and other platforms
  ========================================================= -->

  <meta
    property="og:title"
    content="VENTRON — Engineering starts in the field."
  >

  <meta
    property="og:description"
    content="VENTRON is developing the next generation of suction excavation equipment for infrastructure and industrial applications."
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://maholdingbv.github.io/ventron-market-entry/"
  >

  <meta
    property="og:image"
    content="https://maholdingbv.github.io/ventron-market-entry/assets/ventron-share-preview.jpg"
  >

  <meta
    property="og:image:secure_url"
    content="https://maholdingbv.github.io/ventron-market-entry/assets/ventron-share-preview.jpg"
  >

  <meta
    property="og:image:type"
    content="image/jpeg"
  >

  <meta
    property="og:image:width"
    content="1200"
  >

  <meta
    property="og:image:height"
    content="630"
  >

  <meta
    property="og:image:alt"
    content="VENTRON — Engineering starts in the field."
  >


  <!-- ========================================================
       TWITTER / X PREVIEW
  ========================================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="VENTRON — Engineering starts in the field."
  >

  <meta
    name="twitter:description"
    content="VENTRON is developing the next generation of suction excavation equipment for infrastructure and industrial applications."
  >

  <meta
    name="twitter:image"
    content="https://maholdingbv.github.io/ventron-market-entry/assets/ventron-share-preview.jpg"
  >


  <!-- ========================================================
       STYLING
  ========================================================= -->

  <style>

    :root {
      --deep-graphite: #080D14;
      --graphite: #171F2A;
      --white: #F4F6F8;
      --grey: #98A2AE;
      --border-grey: #35404D;
      --blue: #00B8F0;
      --max-width: 1240px;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
      background: var(--deep-graphite);
      color: var(--white);
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    img {
      max-width: 100%;
      display: block;
    }


    button {
      font-family: inherit;
    }


    .container {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
    }


    /* ========================================================
       HEADER
    ========================================================= */

    header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 10;
      padding: 28px 0;
    }


    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }


    .brand-logo {
      width: 190px;
      height: auto;
    }


    .nav-right {
      display: flex;
      align-items: center;
      gap: 28px;
    }


    .language-switcher {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }


    .language-switcher button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--grey);
      cursor: pointer;
      font: inherit;
      padding: 4px;
      transition: color 0.2s ease;
    }


    .language-switcher button.active,
    .language-switcher button:hover {
      color: var(--white);
    }


    .top-cta {
      border: 1px solid var(--border-grey);
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 600;
      transition: 0.2s ease;
    }


    .top-cta:hover {
      border-color: var(--blue);
      color: var(--blue);
    }


    /* ========================================================
       HERO
    ========================================================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 150px 0 100px;
    }


    .hero::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          90deg,
          rgba(8,13,20,0.99) 0%,
          rgba(8,13,20,0.95) 45%,
          rgba(8,13,20,0.75) 70%,
          rgba(8,13,20,0.55) 100%
        );

      z-index: 1;
    }


    .hero::after {
      content: "";
      position: absolute;
      width: 580px;
      height: 580px;
      right: -240px;
      bottom: -260px;
      border: 1px solid rgba(0,184,240,0.22);
      transform: rotate(45deg);
    }


    .hero-background {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 78% 55%,
          rgba(0,184,240,0.10),
          transparent 32%
        );
    }


    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 820px;
    }


    .eyebrow {
      color: var(--blue);
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      margin-bottom: 22px;
    }


    h1 {
      font-size: clamp(48px, 7vw, 92px);
      line-height: 0.98;
      letter-spacing: -0.04em;
      font-weight: 700;
      max-width: 900px;
    }


    .hero-copy {
      margin-top: 34px;
      max-width: 670px;
      color: var(--grey);
      font-size: clamp(18px, 2vw, 22px);
      line-height: 1.55;
    }


    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 40px;
    }


    /* ========================================================
       BUTTONS
    ========================================================= */

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      padding: 0 24px;
      border: 1px solid var(--border-grey);
      font-weight: 700;
      font-size: 15px;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
    }


    .button-primary {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--deep-graphite);
    }


    .button-primary:hover {
      background: var(--white);
      border-color: var(--white);
    }


    .button-secondary:hover {
      border-color: var(--white);
    }


    /* ========================================================
       GENERAL SECTIONS
    ========================================================= */

    section.content-section {
      padding: 120px 0;
      border-top: 1px solid rgba(53,64,77,0.65);
    }


    .section-grid {
      display: grid;
      grid-template-columns: 0.8fr 1.4fr;
      gap: 100px;
      align-items: start;
    }


    .section-label {
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-size: 13px;
      font-weight: 700;
    }


    h2 {
      font-size: clamp(36px, 5vw, 62px);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }


    .lead {
      font-size: 21px;
      color: var(--white);
      max-width: 750px;
    }


    .supporting {
      margin-top: 24px;
      max-width: 720px;
      color: var(--grey);
      font-size: 17px;
    }


    /* ========================================================
       POSITION
    ========================================================= */

    .position {
      background: var(--graphite);
    }


    .statement {
      margin-top: 50px;
      padding-top: 34px;
      border-top: 1px solid var(--border-grey);
      font-size: clamp(26px, 3.2vw, 42px);
      line-height: 1.2;
      font-weight: 600;
      max-width: 850px;
    }


    /* ========================================================
       DEVELOPMENT PRINCIPLES
    ========================================================= */

    .principles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border-grey);
      margin-top: 70px;
      border: 1px solid var(--border-grey);
    }


    .principle {
      background: var(--deep-graphite);
      padding: 38px;
      min-height: 220px;
    }


    .principle-number {
      display: block;
      color: var(--blue);
      font-size: 13px;
      margin-bottom: 48px;
    }


    .principle h3 {
      font-size: 23px;
      margin-bottom: 14px;
    }


    .principle p {
      color: var(--grey);
      font-size: 15px;
    }


    /* ========================================================
       WHATSAPP / CONTACT
    ========================================================= */

    .contact-section {
      position: relative;
      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          var(--graphite),
          var(--deep-graphite)
        );
    }


    .contact-inner {
      max-width: 900px;
    }


    .contact-inner .lead {
      margin-bottom: 20px;
    }


    .contact-inner .supporting {
      margin-bottom: 38px;
    }


    /* ========================================================
       FOOTER
    ========================================================= */

    footer {
      border-top: 1px solid var(--border-grey);
      padding: 38px 0;
    }


    .footer-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      color: var(--grey);
      font-size: 13px;
    }


    .footer-logo {
      width: 145px;
      height: auto;
    }


    /* ========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 800px) {

      .nav-right {
        gap: 14px;
      }


      .top-cta {
        display: none;
      }


      .brand-logo {
        width: 155px;
      }


      .hero {
        min-height: auto;
        padding-top: 180px;
        padding-bottom: 100px;
      }


      .section-grid {
        grid-template-columns: 1fr;
        gap: 38px;
      }


      .principles {
        grid-template-columns: 1fr;
      }


      .footer-inner {
        flex-direction: column;
        align-items: flex-start;
      }

    }

  </style>

</head>
